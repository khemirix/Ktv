<script>(async function () {
  const API_BASE = "https://showbox-api-1.onrender.com";

  // ALWAYS USED COOKIE
  const COOKIE =
    "ui=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3ODAwMTEzNTksIm5iZiI6MTc4MDAxMTM1OSwiZXhwIjoxODExMTE1Mzc5LCJkYXRhIjp7InVpZCI6NDY4ODQwLCJ0b2tlbiI6IjU0ZTZjYjJmM2YzNWVhMjhhZWY1M2QxMDU3ZDliYzE4In19.ceyETOZ_xvfExbhOCSOPQDZBC1QfoeWjfFuQ8GMOXiI";

  const params = new URLSearchParams(window.location.search);
  const movieName = params.get("movie_name");
  const year = params.get("year");

  if (!movieName) {
    document.body.innerHTML = "Missing movie_name";
    return;
  }

  try {
    // 1. SEARCH
    const searchRes = await fetch(
      `${API_BASE}/search?query=${encodeURIComponent(movieName)}`,
      {
        headers: {
          "cookie": COOKIE
        }
      }
    );

    const searchData = await searchRes.json();

    if (!searchData?.results?.length) {
      document.body.innerHTML = "No movie found";
      return;
    }

    let movie = searchData.results[0];

    if (year) {
      const match = searchData.results.find(
        m => String(m.year) === String(year)
      );
      if (match) movie = match;
    }

    // 2. FILES
    const filesRes = await fetch(
      `${API_BASE}/files?id=${movie.id}`,
      {
        headers: {
          "cookie": COOKIE
        }
      }
    );

    const filesData = await filesRes.json();

    const link =
      filesData?.files?.[0]?.url ||
      filesData?.files?.[0]?.link ||
      null;

    // 3. OUTPUT ONLY LINK
    document.body.innerHTML = link || "No link found";

    window.MOVIE_LINK = link;

  } catch (err) {
    console.error(err);
    document.body.innerHTML = "Error loading movie";
  }
})();</script>
