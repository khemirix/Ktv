<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2Khemirix Tv</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Player Modal overlay ───────────────────────────────────── */
    #playerModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.96);
      overflow: hidden;
    }
    #playerModal.active { display: flex; flex-direction: column; }

    /* Close button */
    #playerClose {
      position: absolute;
      top: .75rem; right: 1rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
      z-index: 10;
    }
    #playerClose:hover { background: rgba(255,255,255,0.18); }

    /* ── Inner layout: video | episode panel ───────────────────── */
    #playerInner {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: 100%;
    }

    /* Left: video area */
    #playerMain {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 1.2rem;
      overflow: hidden;
      min-width: 0;
    }

    /* Loading state */
    #playerStateLoading { text-align: center; color: #fff; width: 100%; }
    .player-spinner {
      width: 46px; height: 46px;
      border: 4px solid rgba(255,255,255,0.12);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: pspin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    #playerLoadingTitle { font-size: .9rem; color: rgba(255,255,255,.5); font-family: sans-serif; }

    /* Video state */
    #playerStateVideo { width: 100%; display: flex; flex-direction: column; }
    #playerTitle {
      color: #fff;
      font-size: .92rem;
      font-weight: 600;
      margin-bottom: .5rem;
      font-family: sans-serif;
    }
    #playerVideo {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      background: #000;
      display: block;
      max-height: 72vh;
      object-fit: contain;
    }
    #playerVideoWrap { position: relative; width: 100%; }

    /* Bottom-right controls, sitting just above the native timeline */
    .player-overlay-controls {
      position: absolute;
      right: 12px;
      bottom: 58px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: sans-serif;
    }
    .pc-badge {
      background: rgba(0,0,0,.62);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      border-radius: 5px;
      padding: 5px 8px;
      font-size: .72rem;
      min-width: 48px;
      text-align: center;
    }
    .pc-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.62);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      font-size: .85rem;
      transition: all .18s;
    }
    .pc-btn:hover:not(:disabled) { background: rgba(0,0,0,.85); border-color: #e50914; }
    .pc-btn[aria-pressed="true"] { background: #1a7f37; border-color: #1a7f37; }
    .pc-btn:disabled { opacity: .45; cursor: default; }

    .settings-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      width: 235px;
      background: rgba(12,12,12,.97);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      padding: .7rem;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      font-size: .78rem;
    }
    .settings-menu[hidden] { display: none; }
    .settings-head { font-weight: 700; margin-bottom: .55rem; font-size: .82rem; }
    .settings-section {
      border-top: 1px solid rgba(255,255,255,.09);
      padding-top: .55rem;
      margin-top: .55rem;
    }
    .settings-label {
      color: rgba(255,255,255,.5);
      margin-bottom: .35rem;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .settings-options { display: flex; flex-wrap: wrap; gap: .3rem; }
    .settings-option, .quality-btn {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.13);
      color: rgba(255,255,255,.7);
      border-radius: 4px;
      padding: .24rem .55rem;
      font-size: .72rem;
      cursor: pointer;
    }
    .settings-option:hover, .quality-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
    .settings-option.active, .quality-btn.active { background: #e50914; border-color: #e50914; color: #fff; }
    .menu-btn {
      width: 100%;
      text-align: left;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.13);
      color: #fff;
      border-radius: 4px;
      padding: .35rem .55rem;
      font-size: .74rem;
      cursor: pointer;
    }
    .menu-btn:hover { background: rgba(255,255,255,.14); }

    #playerVideo::cue {
      direction: rtl;
      text-align: right;
      color: #fff;
      font-size: 1.15rem;                /* updated by the settings menu */
      background: rgba(0,0,0,.65);       /* updated by the settings menu */
    }

    /* Error state */
    #playerStateError { text-align: center; color: #fff; font-family: sans-serif; }
    .error-icon { font-size: 2.2rem; margin-bottom: .6rem; }
    #playerErrorMsg { color: rgba(255,255,255,.45); font-size: .85rem; margin-top: .3rem; }

    /* ── Episode panel (right sidebar) ──────────────────────────── */
    #episodePanel {
      width: 280px;
      flex-shrink: 0;
      background: #0d0d0d;
      border-left: 1px solid rgba(255,255,255,.07);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #episodePanel[hidden] { display: none; }

    #seasonTabs {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      padding: .75rem .75rem .5rem;
      border-bottom: 1px solid rgba(255,255,255,.07);
      flex-shrink: 0;
    }
    .season-tab {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.55);
      border-radius: 5px;
      padding: .22rem .6rem;
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      font-family: monospace;
    }
    .season-tab:hover { background: rgba(255,255,255,.12); color: #fff; }
    .season-tab.active { background: #e50914; border-color: #e50914; color: #fff; }

    #episodeList {
      flex: 1;
      overflow-y: auto;
      padding: .4rem .5rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.12) transparent;
    }
    #episodeList::-webkit-scrollbar { width: 4px; }
    #episodeList::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

    .ep-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .45rem .5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s;
      border: 1px solid transparent;
    }
    .ep-item:hover { background: rgba(255,255,255,.06); }
    .ep-item.active {
      background: rgba(229,9,20,.1);
      border-color: rgba(229,9,20,.3);
    }

    .ep-thumb {
      width: 68px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    .ep-thumb-placeholder {
      width: 68px;
      height: 40px;
      border-radius: 4px;
      flex-shrink: 0;
      background: #1a1a1a;
    }

    .ep-info { min-width: 0; }
    .ep-num {
      font-family: monospace;
      font-size: .65rem;
      color: #e50914;
      font-weight: 700;
    }
    .ep-name {
      font-size: .75rem;
      color: rgba(255,255,255,.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: .1rem;
    }
    .ep-item.active .ep-name { color: #fff; }

    .ep-loading {
      text-align: center;
      color: rgba(255,255,255,.3);
      font-size: .78rem;
      padding: 1.5rem 0;
      font-family: sans-serif;
    }

    /* Responsive: stack on small screens */
    @media (max-width: 640px) {
      #playerInner { flex-direction: column; }
      #episodePanel {
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,.07);
        max-height: 38vh;
      }
    }

    @keyframes pspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">
        <i class="fas fa-film"></i>
        <img src="./css/img/khemirix.png" alt="Khemirix" width="50%">
      </span>
      <div class="d-flex gap-3 align-items-center">
        <div class="nav-tabs-custom">
          <button type="button" class="tab-btn" data-tab="movies" tabindex="0">Movies</button>
          <button type="button" class="tab-btn" data-tab="tv" tabindex="0">TV Shows</button>
          <a href="tv.html" class="tab-btn" data-tab="live" tabindex="0">Live TV</a>
        </div>
        <div class="nav-search-wrap">
          <div class="nav-search-row">
            <input type="text" id="searchInput" class="form-control form-control-sm search-input"
              placeholder="Search movies, shows…" aria-label="Search" tabindex="0">
            <button type="button" id="searchClear" class="search-clear" tabindex="0" aria-label="Clear search">×</button>
          </div>
          <div class="search-filters" id="searchFilters" aria-label="Filter search results">
            <button type="button" class="search-filter active" data-filter="all" tabindex="0">All</button>
            <button type="button" class="search-filter" data-filter="movie" tabindex="0">Movies</button>
            <button type="button" class="search-filter" data-filter="tv" tabindex="0">TV Shows</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero -->
<div id="heroImage">
  <div class="hero-content">
    <h1 id="heroTitle"></h1>
    <p id="heroDescription"></p>
    <button id="heroPlayBtn">Play Now</button>
  </div>
</div>

  <!-- Content -->
  <div class="container-fluid content-container">
    <div id="mainContent"></div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="details-modal" role="dialog" aria-modal="true" hidden>
    <button id="detailsClose" class="details-close" aria-label="Close details" tabindex="0">X</button>
    <div class="details-scroll">
      <div id="detailsBackdrop" class="details-backdrop"></div>
      <div class="details-inner">
        <div class="details-header">
          <img id="detailsPoster" class="details-poster" src="" alt="Poster">
          <div class="details-copy">
            <span id="detailsType" class="details-type">MOVIE</span>
            <h1 id="detailsTitle">Loading…</h1>
            <div id="detailsMeta" class="details-meta"></div>
            <div id="detailsGenres" class="details-genres"></div>
            <p id="detailsOverview" class="details-overview"></p>
            <button id="detailsPlayBtn" class="details-play" type="button" tabindex="0">Play now</button>
          </div>
        </div>
        <section id="detailsEpisodesSection" class="details-episodes" hidden>
          <div class="details-episodes-head">
            <h2>Episodes</h2>
            <div id="detailsSeasonTabs" class="details-season-tabs"></div>
          </div>
          <div id="detailsEpisodeList" class="details-episode-list"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- ── Player Modal ───────────────────────────────────────────── -->
  <div id="playerModal" role="dialog" aria-modal="true" aria-label="Video Player">
    <button id="playerClose" aria-label="Close player">✕</button>

    <div id="playerInner">

      <!-- Left: video + states -->
      <div id="playerMain">

        <!-- Loading -->
        <div id="playerStateLoading">
          <div class="player-spinner"></div>
          <div id="playerLoadingTitle">Loading…</div>
        </div>

        <!-- Video -->
        <div id="playerStateVideo" hidden>
          <div id="playerTitle"></div>
          <div id="playerVideoWrap">
            <video id="playerVideo" controls playsinline></video>

            <!-- Controls float on the right, next to the native timeline -->
            <div class="player-overlay-controls" id="playerControls">
              <span id="qualityBadge" class="pc-badge">—</span>
              <button id="subtitleToggle" class="pc-btn" type="button" aria-pressed="true" disabled
                      aria-label="Toggle Arabic subtitles" title="Arabic subtitles">
                <i class="fas fa-closed-captioning"></i>
              </button>
              <button id="playerSettingsBtn" class="pc-btn" type="button"
                      aria-label="Player settings" title="Quality &amp; subtitle settings">
                <i class="fas fa-gear"></i>
              </button>

              <div id="settingsMenu" class="settings-menu" hidden>
                <div class="settings-head">⚙️ Player settings</div>

                <div class="settings-section">
                  <div class="settings-label">Video quality</div>
                  <div id="qualityList" class="settings-options"></div>
                  <button id="rememberQuality" class="menu-btn" type="button" aria-pressed="false" style="margin-top:.45rem" disabled>
                    Remember quality: Off
                  </button>
                </div>

                <div class="settings-section">
                  <div class="settings-label">Subtitles</div>
                  <button id="menuSubtitleToggle" class="menu-btn" type="button" disabled>
                    Arabic subtitles: Loading…
                  </button>
                  <div class="settings-label" style="margin-top:.55rem">Size</div>
                  <div class="settings-options" id="subtitleSizeOptions">
                    <button class="settings-option" type="button" data-size="small">Small</button>
                    <button class="settings-option" type="button" data-size="medium">Medium</button>
                    <button class="settings-option" type="button" data-size="large">Large</button>
                    <button class="settings-option" type="button" data-size="xlarge">XL</button>
                  </div>
                  <div class="settings-label" style="margin-top:.55rem">Background</div>
                  <div class="settings-options" id="subtitleBgOptions">
                    <button class="settings-option" type="button" data-bg="none">None</button>
                    <button class="settings-option" type="button" data-bg="dark">Dark</button>
                    <button class="settings-option" type="button" data-bg="solid">Solid</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Error -->
        <div id="playerStateError" hidden>
          <div class="error-icon">🎬</div>
          <div style="font-size:1.1rem;font-weight:700;color:#fff;font-family:sans-serif">Not Found</div>
          <div id="playerErrorMsg"></div>
        </div>

      </div>

      <!-- Right: episode panel (TV only) -->
      <div id="episodePanel" hidden>
        <div id="seasonTabs"></div>
        <div id="episodeList"></div>
      </div>

    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/resolver.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="js/media-player.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
