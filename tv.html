<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khemirix TV - Live Channels</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">

<style>
/* (KEEP YOUR CSS EXACTLY SAME — NO CHANGES NEEDED) */
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <span class="navbar-brand mb-0 h1">
      <i class="fas fa-film"></i>
      <img src="./css/img/khemirix.png" alt="" width="50%">
    </span>

    <div class="d-flex gap-3 align-items-center">
      <div class="nav-tabs-custom">
        <a href="index.html" class="tab-btn">Movies</a>
        <a href="index.html" class="tab-btn">TV Shows</a>
        <a href="tv.html" class="tab-btn active">Live TV</a>
      </div>

      <input type="text" id="searchInput" class="form-control form-control-sm search-input" placeholder="Search channels...">
    </div>
  </div>
</nav>

<div class="tv-hero">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center gap-3 mb-2">
      <div class="live-badge"><div class="live-dot"></div>LIVE NOW</div>
    </div>

    <h1 style="font-size:2.2rem;font-weight:800;color:#fff;margin-bottom:8px;">
      Live <span style="color:#e50914;">TV</span> Channels
    </h1>

    <p style="color:rgba(255,255,255,0.45);font-size:0.95rem;max-width:480px;">
      Click 3ala ay channel bch tabda tetfarej.
    </p>

    <div class="category-filters" id="categoryFilters"></div>
  </div>
</div>

<div class="container-fluid px-4 py-4">
  <div class="row g-3" id="channelsGrid"></div>
</div>

<!-- PLAYER MODAL -->
<div class="modal fade tv-player-modal" id="tvPlayerModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <div class="d-flex align-items-center gap-2 flex-grow-1">
          <div class="modal-channel-logo">
            <img id="modalLogo">
          </div>
          <span class="modal-channel-name" id="modalName">Channel</span>
          <span class="player-status loading ms-2" id="playerStatus">LOADING</span>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="video-container">
        <video id="tvVideo" controls playsinline></video>

        <div class="video-loader" id="videoLoader">
          <div class="spinner-tv"></div>
          <div class="loader-text" id="loaderText">Connecting...</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>

<script>
var PROXY = 'https://t-ahg3.onrender.com';
var channels = [];
var activeCategory = 'All';
var currentPlayer = null;
var playerModal;

window.addEventListener('DOMContentLoaded', function () {

  playerModal = new bootstrap.Modal(document.getElementById('tvPlayerModal'));

  document.getElementById('tvPlayerModal').addEventListener('hidden.bs.modal', stopStream);

  fetch('channels.json')
    .then(r => r.json())
    .then(data => {
      channels = data;
      buildCategories();
      renderChannels(channels);
    });

  document.getElementById('searchInput').addEventListener('input', function () {
    let q = this.value.toLowerCase().trim();
    let base = activeCategory === 'All'
      ? channels
      : channels.filter(c => c.category === activeCategory);

    let filtered = q
      ? base.filter(c => c.name.toLowerCase().includes(q))
      : base;

    renderChannels(filtered);
  });
});

/* ---------------- CATEGORY ---------------- */
function buildCategories() {
  let cats = ['All'];
  channels.forEach(c => {
    if (!cats.includes(c.category)) cats.push(c.category);
  });

  document.getElementById('categoryFilters').innerHTML =
    cats.map(cat =>
      `<button class="cat-btn ${cat === 'All' ? 'active' : ''}"
        onclick="filterBy('${cat}', this)">${cat}</button>`
    ).join('');
}

function filterBy(cat, btn) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  let filtered = cat === 'All'
    ? channels
    : channels.filter(c => c.category === cat);

  renderChannels(filtered);
}

/* ---------------- CHANNELS ---------------- */
function renderChannels(list) {
  const grid = document.getElementById('channelsGrid');

  if (!list.length) {
    grid.innerHTML = '<div class="no-channels col-12">No channels found</div>';
    return;
  }

  grid.innerHTML = list.map(ch => {
    const data = encodeURIComponent(JSON.stringify(ch));

    return `
    <div class="col-6 col-sm-4 col-md-3 col-lg-2">
      <div class="channel-card"
        onclick="openChannel(decodeURIComponent('${data}'))"
        onmouseenter="preloadStream('${ch.stream}')">

        <div class="channel-poster">
          <img src="${ch.logo}" onerror="this.src='https://placehold.co/320x180'">
          <div class="card-play-overlay"><i class="fas fa-play"></i></div>
          <span class="card-live-tag">LIVE</span>
        </div>

        <div class="channel-info">
          <div class="channel-name">${ch.name}</div>
          <div class="channel-cat">${ch.category}</div>
        </div>

      </div>
    </div>`;
  }).join('');
}

/* ---------------- PLAYER ---------------- */
function openChannel(dataStr) {
  const ch = JSON.parse(dataStr);

  document.getElementById('modalLogo').src = ch.logo;
  document.getElementById('modalName').textContent = ch.name;

  setStatus('loading');
  showLoader(true, 'Loading buffer...');

  playerModal.show();

  playStream(ch.stream);
}

/* ---------------- PRELOAD (IMPORTANT) ---------------- */
function preloadStream(streamUrl) {
  const v = document.createElement('video');
  v.preload = "auto";
  v.src = PROXY + '/fetch?url=' + encodeURIComponent(streamUrl);
}

/* ---------------- STREAM ---------------- */
function stopStream() {
  if (currentPlayer) {
    try { currentPlayer.destroy(); } catch(e) {}
    currentPlayer = null;
  }

  const v = document.getElementById('tvVideo');
  v.pause();
  v.src = '';
}

function playStream(streamUrl) {

  const proxyUrl = PROXY + '/fetch?url=' + encodeURIComponent(streamUrl);
  const video = document.getElementById('tvVideo');

  stopStream();

  video.addEventListener('playing', () => {
    setStatus('playing');
    showLoader(false);
  });

  video.addEventListener('waiting', () => {
    showLoader(true, 'Buffering...');
  });

  video.addEventListener('stalled', () => {
    showLoader(true, 'Weak connection...');
  });

  const isM3U8 = streamUrl.includes('.m3u8');
  const isTS = streamUrl.includes('.ts');

  /* ---------------- HLS (BEST MODE) ---------------- */
  if (isM3U8 && Hls.isSupported()) {

    currentPlayer = new Hls({
      enableWorker: true,
      lowLatencyMode: true,

      maxBufferLength: 30,
      backBufferLength: 10,

      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 10,

      startLevel: -1,
      capLevelToPlayerSize: true,
      abrEwmaDefaultEstimate: 500000
    });

    currentPlayer.loadSource(proxyUrl);
    currentPlayer.attachMedia(video);

    currentPlayer.on(Hls.Events.MANIFEST_PARSED, () => {

      video.pause();

      const check = setInterval(() => {
        if (video.buffered.length && video.buffered.end(0) > 5) {
          clearInterval(check);
          video.play().catch(() => {});
        }
      }, 200);
    });

    return;
  }

  /* ---------------- MPEG-TS ---------------- */
  if (isTS && mpegts.isSupported()) {

    currentPlayer = mpegts.createPlayer({
      type: 'mpegts',
      isLive: true,
      url: proxyUrl
    }, {
      liveBufferLatencyChasing: true,
      liveSync: true
    });

    currentPlayer.attachMediaElement(video);
    currentPlayer.load();
    currentPlayer.play();

    return;
  }

  /* ---------------- FALLBACK ---------------- */
  video.src = proxyUrl;
  video.play().catch(() => {});
}

/* ---------------- UI ---------------- */
function setStatus(state) {
  const el = document.getElementById('playerStatus');
  el.className = 'player-status ' + state;
  el.textContent = state.toUpperCase();
}

function showLoader(show, msg) {
  const el = document.getElementById('videoLoader');

  if (!show) {
    el.classList.add('hidden');
    return;
  }

  el.classList.remove('hidden');
  if (msg) document.getElementById('loaderText').textContent = msg;
}
</script>

</body>
</html>
