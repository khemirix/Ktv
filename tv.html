<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2Khemirix TV - Live Channels</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    background: rgba(229, 9, 20, 0.15);
    border: 1px solid rgba(229, 9, 20, 0.4);
    color: #e50914;
    padding: 3px 8px;
    border-radius: 3px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #e50914;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .tv-hero {
    padding: 90px 0 40px;
    background: linear-gradient(180deg, rgba(229,9,20,0.08) 0%, transparent 100%);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .category-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 20px 0;
  }
  .cat-btn {
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }
  .cat-btn.active { background: #e50914; border-color: #e50914; color: #fff; }
  .channel-card {
    background: #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }
  .channel-card:hover {
    transform: scale(1.04);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    border-color: rgba(229,9,20,0.4);
  }
  .channel-card:hover .card-play-overlay { opacity: 1; }
  .channel-poster {
    aspect-ratio: 16/9;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .channel-poster img {
    width: 60%;
    height: 60%;
    object-fit: contain;
    transition: transform 0.3s;
  }
  .channel-card:hover .channel-poster img { transform: scale(1.08); }
  .card-play-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .card-play-overlay i { font-size: 2.5rem; color: #fff; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7)); }
  .card-live-tag {
    position: absolute; top: 8px; left: 8px;
    font-size: 0.55rem; font-weight: 700; letter-spacing: 0.1em;
    background: #e50914; color: #fff; padding: 2px 6px; border-radius: 3px;
  }
  .channel-info { padding: 10px 12px; }
  .channel-name {
    font-size: 0.85rem; font-weight: 600; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px;
  }
  .channel-cat { font-size: 0.68rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.08em; }
  .tv-player-modal .modal-content {
    background: #0a0a0a;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
  }
  .tv-player-modal .modal-header {
    background: #111;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px;
  }
  .modal-channel-logo {
    width: 32px; height: 32px;
    background: #1a1a1a; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .modal-channel-logo img { width: 26px; height: 26px; object-fit: contain; }
  .modal-channel-name { font-size: 0.95rem; font-weight: 700; color: #fff; }
  .player-status {
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
    padding: 3px 8px; border-radius: 3px;
  }
  .player-status.loading { background: rgba(255,193,7,0.15); color: #ffc107; }
  .player-status.playing { background: rgba(25,135,84,0.15); color: #198754; }
  .player-status.error { background: rgba(229,9,20,0.15); color: #e50914; }
  .video-container { position: relative; background: #000; aspect-ratio: 16/9; }
  .video-container video { width: 100%; height: 100%; display: block; }
  .video-loader {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    transition: opacity 0.3s;
  }
  .video-loader.hidden { opacity: 0; pointer-events: none; }
  .spinner-tv {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #e50914;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-size: 0.75rem; color: rgba(255,255,255,0.4); }
  .no-channels { color: rgba(255,255,255,0.3); text-align: center; padding: 60px 0; font-size: 0.9rem; }
  .playlist-loader {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-top: 14px;
  }
  .playlist-loader input[type="text"], .playlist-loader input[type="file"] {
    font-size: 0.75rem; max-width: 280px;
  }
  .playlist-loader .btn-sm { font-size: 0.75rem; font-weight: 600; }
  .playlist-status { font-size: 0.7rem; color: rgba(255,255,255,0.45); flex-basis: 100%; }
  .playlist-status.error { color: #ff6b6b; }
  .live-track-bar {
    display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 16px;
    background: #0a0a0a; border-top: 1px solid rgba(255,255,255,0.06);
  }
  .live-track-bar label { font-size: 0.65rem; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.08em; }
  .live-track-bar select {
    background: #141414; color: #fff; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px; font-size: 0.75rem; padding: 4px 8px; max-width: 220px;
  }
  .live-track-bar[hidden] { display: none; }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <span class="navbar-brand mb-0 h1">
      <i class="fas fa-film"></i>
      <img src="./css/img/Khemirix.png" alt="" width="50%">
    </span>
    <div class="d-flex gap-3 align-items-center">
      <div class="nav-tabs-custom">
        <a href="index.html" class="tab-btn">Movies</a>
        <a href="index.html?tab=tv" class="tab-btn">TV Shows</a>
        <a href="tv.html" class="tab-btn active">Live TV</a>
      </div>
      <input type="text" id="searchInput" class="form-control form-control-sm search-input" placeholder="Search channels..." aria-label="Search">
    </div>
  </div>
</nav>

<div class="tv-hero">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center gap-3 mb-2">
      <div class="live-badge"><div class="live-dot"></div>LIVE NOW</div>
    </div>
    <h1 style="font-size:2.2rem;font-weight:800;color:#fff;margin-bottom:8px;">Live <span style="color:#e50914;">TV</span> Channels</h1>
    <p style="color:rgba(255,255,255,0.45);font-size:0.95rem;max-width:480px;">Stream live channels directly in your browser. Click any channel to start watching.</p>
    <div class="category-filters" id="categoryFilters"></div>
    <div class="playlist-loader">
      <input type="text" id="playlistUrl" class="form-control form-control-sm" placeholder="M3U playlist URL (optional)" aria-label="M3U playlist URL">
      <button type="button" class="btn btn-sm btn-outline-light" id="loadPlaylistUrl">Load URL</button>
      <input type="file" id="playlistFile" class="form-control form-control-sm" accept=".m3u,.m3u8,text/plain" aria-label="Local M3U playlist">
      <button type="button" class="btn btn-sm btn-outline-light" id="loadPlaylistFile">Load File</button>
      <span class="playlist-status" id="playlistStatus">Playlists are parsed in a background worker; the built-in channel list stays available.</span>
    </div>
  </div>
</div>

<div class="container-fluid px-4 py-4">
  <div class="row g-3" id="channelsGrid"></div>
</div>

<!-- Player Modal -->
<div class="modal fade tv-player-modal" id="tvPlayerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div class="d-flex align-items-center gap-2 flex-grow-1">
          <div class="modal-channel-logo">
            <img id="modalLogo" src="" alt="">
          </div>
          <span class="modal-channel-name" id="modalName">Channel</span>
          <span class="player-status loading ms-2" id="playerStatus">LOADING</span>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="video-container">
        <video id="tvVideo" controls playsinline></video>
        <div class="video-loader" id="videoLoader">
          <div class="spinner-tv"></div>
          <div class="loader-text" id="loaderText">Connecting to stream...</div>
        </div>
      </div>
      <div class="live-track-bar" id="trackBar" hidden>
        <div id="audioTrackWrap" hidden>
          <label for="audioTrackSelect">Audio</label>
          <select id="audioTrackSelect"></select>
        </div>
        <div id="subtitleTrackWrap" hidden>
          <label for="subtitleTrackSelect">Subtitles</label>
          <select id="subtitleTrackSelect"></select>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script src="js/stream-detector.js"></script>
<script src="js/m3u-parser.js"></script>
<script src="js/live-player.js"></script>
<script src="js/tv-app.js"></script>
</body>
</html>
