<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTV - Live TV</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080c10;
    --surface: #0e1419;
    --border: #1c2530;
    --accent: #00e5ff;
    --accent2: #ff3d71;
    --text: #c8d6e5;
    --muted: #4a5568;
    --green: #00ff88;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 40px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,16,0.95);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .nav-logo {
    font-size: 1.4rem;
    font-weight: 800;
    color: #fff;
    text-decoration: none;
    letter-spacing: -0.02em;
  }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 24px; margin-left: 32px; }
  .nav-links a {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    letter-spacing: 0.02em;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--accent); }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .live-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    background: rgba(255,61,113,0.15);
    border: 1px solid rgba(255,61,113,0.3);
    color: var(--accent2);
    padding: 4px 10px;
    border-radius: 3px;
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* HERO */
  .hero {
    padding: 60px 40px 40px;
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(0,229,255,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(255,61,113,0.05) 0%, transparent 55%);
  }
  .hero-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .hero h1 {
    font-size: 2.8rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: 0.95rem;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.6;
  }

  /* FILTERS */
  .filters {
    padding: 24px 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #080c10; }
  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    padding: 8px 14px 8px 34px;
    outline: none;
    width: 200px;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  /* GRID */
  .grid-section { padding: 32px 40px; }
  .section-title {
    font-size: 0.7rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .channels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .channel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .channel-card:hover {
    transform: translateY(-4px);
    border-color: rgba(0,229,255,0.3);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .channel-card:hover .card-play { opacity: 1; }

  .card-poster {
    aspect-ratio: 16/9;
    background: #0a0f14;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .card-poster img {
    width: 70%;
    height: 70%;
    object-fit: contain;
    filter: brightness(0.9);
    transition: transform 0.3s;
  }
  .channel-card:hover .card-poster img { transform: scale(1.05); }

  .card-play {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .card-play svg { width: 40px; height: 40px; fill: #fff; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }

  .card-info { padding: 12px; }
  .card-name {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .card-category {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .card-live {
    position: absolute;
    top: 8px; right: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.55rem;
    background: rgba(255,61,113,0.9);
    color: #fff;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.08em;
  }

  /* PLAYER MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transform: scale(0.95);
    transition: transform 0.3s;
  }
  .modal-overlay.open .modal { transform: scale(1); }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-logo {
    width: 36px; height: 36px;
    background: #0a0f14;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .modal-logo img { width: 28px; height: 28px; object-fit: contain; }
  .modal-title { font-size: 0.95rem; font-weight: 700; color: #fff; flex: 1; }
  .modal-status {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.08em;
  }
  .modal-status.loading { background: rgba(0,229,255,0.1); color: var(--accent); }
  .modal-status.playing { background: rgba(0,255,136,0.1); color: var(--green); }
  .modal-status.error { background: rgba(255,61,113,0.1); color: var(--accent2); }
  .modal-status.idle { background: rgba(74,85,104,0.2); color: var(--muted); }

  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.2rem;
    padding: 4px;
    line-height: 1;
    transition: color 0.2s;
  }
  .modal-close:hover { color: var(--accent2); }

  .modal-video { position: relative; background: #000; aspect-ratio: 16/9; }
  .modal-video video { width: 100%; height: 100%; display: block; }

  .modal-overlay-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(8,12,16,0.9);
    transition: opacity 0.3s;
  }
  .modal-overlay-inner.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 38px; height: 38px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay-text { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--muted); text-align: center; }

  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    nav { padding: 14px 20px; }
    .hero { padding: 40px 20px 30px; }
    .hero h1 { font-size: 1.8rem; }
    .filters { padding: 16px 20px; }
    .grid-section { padding: 24px 20px; }
    .channels-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .search-wrap { display: none; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">K<span>TV</span></a>
  <div class="nav-links">
    <a href="index.html">Movies</a>
    <a href="tv.html" class="active">Live TV</a>
  </div>
  <div class="nav-right">
    <div class="live-badge">
      <div class="live-dot"></div>
      LIVE
    </div>
  </div>
</nav>

<div class="hero">
  <div class="hero-label">Live Streaming</div>
  <h1>Watch <span>Live TV</span></h1>
  <p>Browse and stream live channels directly in your browser. Click any channel to start watching.</p>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterChannels('All', this)">All</button>
  <div id="categoryFilters"></div>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search channels..." oninput="searchChannels(this.value)" />
  </div>
</div>

<div class="grid-section">
  <div class="section-title" id="gridLabel">All Channels</div>
  <div class="channels-grid" id="channelsGrid"></div>
</div>

<!-- Player Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-logo"><img id="modalLogo" src="" alt="" /></div>
      <div class="modal-title" id="modalTitle">Channel</div>
      <span class="modal-status idle" id="modalStatus">IDLE</span>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-video">
      <video id="modalVideo" controls playsinline></video>
      <div class="modal-overlay-inner" id="videoOverlay">
        <div class="spinner"></div>
        <div class="overlay-text" id="overlayText">Connecting...</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script>
  var PROXY = 'https://t-ahg3.onrender.com';
  var channels = [];
  var currentHls = null;
  var activeCategory = 'All';

  // Load channels.json
  fetch('channels.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      channels = data;
      buildFilters();
      renderGrid(channels);
    })
    .catch(function(e) {
      document.getElementById('channelsGrid').innerHTML = '<div class="no-results">Could not load channels.json</div>';
    });

  function buildFilters() {
    var cats = ['All'];
    channels.forEach(function(c) {
      if (cats.indexOf(c.category) === -1) cats.push(c.category);
    });
    var wrap = document.getElementById('categoryFilters');
    wrap.innerHTML = '';
    cats.slice(1).forEach(function(cat) {
      var btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = cat;
      btn.onclick = function() { filterChannels(cat, btn); };
      wrap.appendChild(btn);
    });
  }

  function filterChannels(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    var filtered = cat === 'All' ? channels : channels.filter(function(c) { return c.category === cat; });
    document.getElementById('gridLabel').textContent = cat === 'All' ? 'All Channels' : cat;
    renderGrid(filtered);
  }

  function searchChannels(q) {
    q = q.toLowerCase().trim();
    var base = activeCategory === 'All' ? channels : channels.filter(function(c) { return c.category === activeCategory; });
    var filtered = q ? base.filter(function(c) { return c.name.toLowerCase().indexOf(q) !== -1; }) : base;
    renderGrid(filtered);
  }

  function renderGrid(list) {
    var grid = document.getElementById('channelsGrid');
    if (!list.length) {
      grid.innerHTML = '<div class="no-results">No channels found.</div>';
      return;
    }
    grid.innerHTML = list.map(function(ch) {
      return '<div class="channel-card" onclick="openChannel(' + JSON.stringify(ch).replace(/"/g, '&quot;') + ')">' +
        '<div class="card-poster">' +
          '<img src="' + ch.logo + '" alt="' + ch.name + '" onerror="this.src=\'https://placehold.co/320x180/0e1419/4a5568?text=TV\'" />' +
          '<div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>' +
          '<span class="card-live">LIVE</span>' +
        '</div>' +
        '<div class="card-info">' +
          '<div class="card-name">' + ch.name + '</div>' +
          '<div class="card-category">' + ch.category + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function openChannel(ch) {
    document.getElementById('modalTitle').textContent = ch.name;
    document.getElementById('modalLogo').src = ch.logo;
    document.getElementById('modalOverlay').classList.add('open');
    setModalStatus('loading');
    showVideoOverlay(true, 'Connecting to ' + ch.name + '...');
    playStream(ch.stream);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    stopStream();
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  function setModalStatus(state) {
    var el = document.getElementById('modalStatus');
    el.className = 'modal-status ' + state;
    var labels = { loading: 'LOADING', playing: 'LIVE', error: 'ERROR', idle: 'IDLE' };
    el.textContent = labels[state] || 'IDLE';
  }

  function showVideoOverlay(show, msg) {
    var ov = document.getElementById('videoOverlay');
    if (!show) { ov.classList.add('hidden'); return; }
    ov.classList.remove('hidden');
    document.getElementById('overlayText').textContent = msg || 'Connecting...';
  }

  function stopStream() {
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    var video = document.getElementById('modalVideo');
    video.pause();
    video.src = '';
    setModalStatus('idle');
    showVideoOverlay(true, 'Select a channel to watch');
  }

  function playStream(streamUrl) {
    var proxyUrl = PROXY + '/fetch?url=' + encodeURIComponent(streamUrl);
    var video = document.getElementById('modalVideo');

    if (currentHls) { currentHls.destroy(); currentHls = null; }

    if (Hls.isSupported()) {
      currentHls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });

      currentHls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(function() {});
      });

      currentHls.on(Hls.Events.ERROR, function(e, data) {
        if (data.fatal) {
          currentHls.destroy(); currentHls = null;
          // fallback: direct src
          video.src = proxyUrl;
          video.play().catch(function() {});
        }
      });

      currentHls.loadSource(proxyUrl);
      currentHls.attachMedia(video);

    } else {
      video.src = proxyUrl;
      video.play().catch(function() {});
    }

    video.onplaying = function() {
      setModalStatus('playing');
      showVideoOverlay(false);
    };
    video.onwaiting = function() {
      showVideoOverlay(true, 'Buffering...');
    };
    video.onplaying = function() {
      setModalStatus('playing');
      showVideoOverlay(false);
    };
    video.onerror = function() {
      setModalStatus('error');
      showVideoOverlay(true, 'Stream error. Try another channel.');
    };
  }

  // Close modal on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
