<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showbox Test Player</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c6af7;
    --accent2: #f76a8a;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --success: #4ade80;
    --error: #f87171;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    left: -20%;
    width: 70%;
    height: 70%;
    background: radial-gradient(ellipse, rgba(124,106,247,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    margin-bottom: 3rem;
    animation: fadeDown 0.6s ease;
  }

  .logo {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.8rem;
    margin-bottom: 1.5rem;
    animation: fadeUp 0.5s ease;
  }

  .card-title {
    font-size: 0.7rem;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .input-row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  input[type="text"], input[type="number"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    padding: 0.75rem 1rem;
    outline: none;
    transition: border-color 0.2s;
    flex: 1;
    min-width: 160px;
  }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  button {
    background: linear-gradient(135deg, var(--accent), #5a4fd8);
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 0.75rem 1.5rem;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  button:hover { opacity: 0.88; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  button.secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .status {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    margin-top: 1rem;
    display: none;
  }

  .status.info { background: rgba(124,106,247,0.1); color: var(--accent); border: 1px solid rgba(124,106,247,0.2); display: block; }
  .status.success { background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.2); display: block; }
  .status.error { background: rgba(248,113,113,0.1); color: var(--error); border: 1px solid rgba(248,113,113,0.2); display: block; }

  .movie-info {
    display: flex;
    gap: 1.2rem;
    align-items: flex-start;
    margin-bottom: 1.2rem;
  }

  .movie-poster {
    width: 80px;
    height: 110px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .movie-poster-placeholder {
    width: 80px;
    height: 110px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    flex-shrink: 0;
  }

  .movie-meta h2 {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.3rem;
  }

  .movie-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }

  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    letter-spacing: 0.05em;
  }

  .tag.accent { border-color: var(--accent); color: var(--accent); }

  .file-list { display: flex; flex-direction: column; gap: 0.75rem; }

  .file-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    transition: border-color 0.2s;
  }

  .file-item:hover { border-color: var(--accent); }

  .file-info { flex: 1; min-width: 0; }

  .file-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .file-size {
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    margin-top: 0.2rem;
  }

  .file-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

  .btn-sm {
    padding: 0.4rem 0.8rem;
    font-size: 0.78rem;
    border-radius: 7px;
  }

  .links-list { display: flex; flex-direction: column; gap: 0.6rem; }

  .link-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .link-quality {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--accent);
  }

  .link-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }

  .link-actions { display: flex; gap: 0.5rem; }

  .player-wrap {
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16/9;
    margin-top: 1rem;
  }

  .player-wrap video {
    width: 100%;
    height: 100%;
    display: block;
  }

  .section { display: none; }
  .section.visible { display: block; }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }

  .api-config {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .api-url-input {
    font-size: 0.78rem;
    padding: 0.5rem 0.8rem;
    flex: 1;
  }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 500px) {
    .file-item { flex-direction: column; align-items: flex-start; }
    .link-item { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">◈ Showbox Player</div>
    <div class="subtitle">// dev test interface — local use only</div>
  </header>

  <!-- Config -->
  <div class="card">
    <div class="card-title">⚙ API Configuration</div>
    <div class="api-config">
      <input type="text" id="apiUrl" class="api-url-input" placeholder="https://showbox-api-1.onrender.com" value="">
      <input type="text" id="cookieInput" style="font-size:0.78rem;padding:0.5rem 0.8rem;flex:1;" placeholder="Febbox ui= cookie (optional)">
    </div>
  </div>

  <!-- Search -->
  <div class="card">
    <div class="card-title">① Search for a Movie or Show</div>
    <div class="input-row">
      <input type="text" id="searchQuery" placeholder="e.g. Avengers, Breaking Bad..." onkeydown="if(event.key==='Enter')doSearch()">
      <select id="searchType" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.9rem;padding:0.75rem 1rem;outline:none;">
        <option value="movie">Movie</option>
        <option value="tv">TV Show</option>
      </select>
      <button onclick="doSearch()" id="searchBtn">Search</button>
    </div>
    <div id="searchStatus" class="status"></div>
    <div id="searchResults" style="margin-top:1rem;display:flex;flex-direction:column;gap:0.6rem;"></div>
  </div>

  <!-- Step 1: Movie ID -->
  <div class="card">
    <div class="card-title">② Or Enter Movie ID Directly</div>
    <div class="input-row">
      <input type="number" id="movieId" placeholder="e.g. 15440" value="">
      <select id="mediaType" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.9rem;padding:0.75rem 1rem;outline:none;">
        <option value="1">Movie</option>
        <option value="2">TV Show</option>
      </select>
      <button onclick="fetchMovie()" id="fetchBtn">Fetch</button>
    </div>
    <div id="movieStatus" class="status"></div>
  </div>

  <!-- Movie Info -->
  <div class="card section" id="movieSection">
    <div class="card-title">② Movie Info</div>
    <div class="movie-info">
      <img id="moviePoster" class="movie-poster" src="" alt="" onerror="this.style.display='none'">
      <div class="movie-meta">
        <h2 id="movieTitle">—</h2>
        <div id="movieYear" style="color:var(--muted);font-size:0.85rem;margin-top:0.2rem;"></div>
        <div class="movie-tags" id="movieTags"></div>
      </div>
    </div>
    <button onclick="fetchFebboxId()" id="febboxBtn">Get Download Files →</button>
    <div id="febboxStatus" class="status"></div>
  </div>

  <!-- Files -->
  <div class="card section" id="filesSection">
    <div class="card-title">③ Available Files</div>
    <div class="file-list" id="fileList"></div>
  </div>

  <!-- Download Links -->
  <div class="card section" id="linksSection">
    <div class="card-title">④ Download Links</div>
    <div class="links-list" id="linksList"></div>
  </div>

  <!-- Player -->
  <div class="card section" id="playerSection">
    <div class="card-title">⑤ Player</div>
    <div class="player-wrap">
      <video id="videoPlayer" controls></video>
    </div>
  </div>
</div>

<script>
  let shareKey = null;

  function getApi() {
    return (document.getElementById('apiUrl').value || 'https://showbox-api-1.onrender.com').replace(/\/$/, '');
  }

  function getCookie() {
    return document.getElementById('cookieInput').value.trim();
  }

  function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `status ${type}`;
  }

  function showSection(id) {
    document.getElementById(id).classList.add('visible');
  }

  function hideSection(id) {
    document.getElementById(id).classList.remove('visible');
  }

  function loading(btnId, state) {
    const btn = document.getElementById(btnId);
    if (state) {
      btn._orig = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span>Loading...';
      btn.disabled = true;
    } else {
      btn.innerHTML = btn._orig;
      btn.disabled = false;
    }
  }

  async function fetchMovie() {
    const id = document.getElementById('movieId').value.trim();
    const type = document.getElementById('mediaType').value;
    if (!id) return setStatus('movieStatus', 'Enter a movie ID first', 'error');

    loading('fetchBtn', true);
    setStatus('movieStatus', 'Fetching movie info...', 'info');
    hideSection('movieSection');
    hideSection('filesSection');
    hideSection('linksSection');
    hideSection('playerSection');

    try {
      const endpoint = type == '1' ? `/api/movie/${id}` : `/api/show/${id}`;
      const res = await fetch(getApi() + endpoint);
      const data = await res.json();

      if (!data || data.error) throw new Error(data.error || 'Not found');

      document.getElementById('movieTitle').textContent = data.title || 'Unknown';
      document.getElementById('movieYear').textContent = `${data.year || ''} · ${data.runtime || '?'} min · ⭐ ${data.imdb_rating || '?'}`;
      document.getElementById('moviePoster').src = data.poster || '';

      const tags = document.getElementById('movieTags');
      tags.innerHTML = '';
      if (data.quality_tag) tags.innerHTML += `<span class="tag accent">${data.quality_tag}</span>`;
      (data.cats || '').split(',').filter(Boolean).forEach(c => {
        tags.innerHTML += `<span class="tag">${c.trim()}</span>`;
      });

      setStatus('movieStatus', `Found: ${data.title}`, 'success');
      showSection('movieSection');
    } catch (e) {
      setStatus('movieStatus', `Error: ${e.message}`, 'error');
    }
    loading('fetchBtn', false);
  }

  async function fetchFebboxId() {
    const id = document.getElementById('movieId').value.trim();
    const type = document.getElementById('mediaType').value;

    loading('febboxBtn', true);
    setStatus('febboxStatus', 'Getting Febbox share key...', 'info');
    hideSection('filesSection');
    hideSection('linksSection');
    hideSection('playerSection');

    try {
      const res = await fetch(`${getApi()}/api/febbox/id?id=${id}&type=${type}`);
      const data = await res.json();

      if (!data.febBoxId) throw new Error('Could not get Febbox ID');
      shareKey = data.febBoxId;

      setStatus('febboxStatus', `Share key: ${shareKey} — fetching files...`, 'info');
      await fetchFiles();
    } catch (e) {
      setStatus('febboxStatus', `Error: ${e.message}`, 'error');
      loading('febboxBtn', false);
    }
  }

  async function fetchFiles() {
    try {
      const headers = {};
      const cookie = getCookie();
      if (cookie) headers['x-auth-cookie'] = cookie;

      const res = await fetch(`${getApi()}/api/febbox/files?shareKey=${shareKey}&parent_id=0`, { headers });
      const files = await res.json();

      if (!Array.isArray(files) || files.length === 0) throw new Error('No files found');

      const list = document.getElementById('fileList');
      list.innerHTML = '';

      files.forEach(f => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <div class="file-info">
            <div class="file-name">${f.file_name}</div>
            <div class="file-size">${f.file_size || '?'} · ${f.ext?.toUpperCase() || 'FILE'}</div>
          </div>
          <div class="file-actions">
            <button class="secondary btn-sm" onclick="fetchLinks(${f.fid})">Get Links</button>
          </div>`;
        list.appendChild(item);
      });

      setStatus('febboxStatus', `Found ${files.length} file(s)`, 'success');
      showSection('filesSection');
    } catch (e) {
      setStatus('febboxStatus', `Files error: ${e.message}`, 'error');
    }
    loading('febboxBtn', false);
  }

  async function fetchLinks(fid) {
    hideSection('linksSection');
    hideSection('playerSection');

    const headers = {};
    const cookie = getCookie();
    if (cookie) headers['x-auth-cookie'] = cookie;

    try {
      const res = await fetch(`${getApi()}/api/febbox/links?shareKey=${shareKey}&fid=${fid}`, { headers });
      const links = await res.json();

      if (links.error) throw new Error(links.error);
      if (!Array.isArray(links) || links.length === 0) throw new Error('No links returned — check your Febbox cookie');

      const list = document.getElementById('linksList');
      list.innerHTML = '';

      links.forEach(link => {
        const item = document.createElement('div');
        item.className = 'link-item';
        item.innerHTML = `
          <div>
            <div class="link-quality">${link.quality || 'Unknown'}</div>
            <div class="link-name">${link.name || ''} ${link.size ? '· ' + link.size : ''}</div>
          </div>
          <div class="link-actions">
            <button class="btn-sm" onclick="playVideo('${link.url}')">▶ Play</button>
            <a href="${link.url}" download target="_blank">
              <button class="secondary btn-sm">↓ Download</button>
            </a>
          </div>`;
        list.appendChild(item);
      });

      showSection('linksSection');
    } catch (e) {
      alert('Links error: ' + e.message);
    }
  }

  function playVideo(url) {
    const player = document.getElementById('videoPlayer');
    player.src = url;
    player.play();
    showSection('playerSection');
    document.getElementById('playerSection').scrollIntoView({ behavior: 'smooth' });
  }

  async function doSearch() {
    const query = document.getElementById('searchQuery').value.trim();
    const type = document.getElementById('searchType').value;
    if (!query) return setStatus('searchStatus', 'Enter a title to search', 'error');

    loading('searchBtn', true);
    setStatus('searchStatus', `Searching for "${query}"...`, 'info');
    document.getElementById('searchResults').innerHTML = '';

    try {
      const res = await fetch(`${getApi()}/api/search?type=${type}&title=${encodeURIComponent(query)}`);
      const data = await res.json();
      const results = data?.list || data || [];

      if (!results.length) throw new Error('No results found');

      setStatus('searchStatus', `Found ${results.length} result(s) — click one to select it`, 'success');

      const container = document.getElementById('searchResults');
      results.slice(0, 15).forEach(item => {
        const mid = item.mid || item.id;
        const mediaTypeVal = type === 'movie' ? '1' : '2';
        const div = document.createElement('div');
        div.style.cssText = 'display:flex;align-items:center;gap:1rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0.8rem 1rem;cursor:pointer;transition:border-color 0.2s;';
        div.onmouseover = () => div.style.borderColor = 'var(--accent)';
        div.onmouseout = () => div.style.borderColor = 'var(--border)';
        div.innerHTML = `
          ${item.poster_min ? `<img src="${item.poster_min}" style="width:40px;height:56px;border-radius:5px;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none'">` : '<div style="width:40px;height:56px;background:var(--border);border-radius:5px;flex-shrink:0;"></div>'}
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:0.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title || 'Unknown'}</div>
            <div style="color:var(--muted);font-family:'DM Mono',monospace;font-size:0.72rem;margin-top:0.2rem;">${item.year || ''} · ID: ${mid} ${item.imdb_rating ? '· ⭐ ' + item.imdb_rating : ''}</div>
          </div>
          <span style="color:var(--accent);font-size:0.8rem;font-weight:700;flex-shrink:0;">Select →</span>`;
        div.onclick = () => {
          document.getElementById('movieId').value = mid;
          document.getElementById('mediaType').value = mediaTypeVal;
          setStatus('searchStatus', `Selected: ${item.title} (ID: ${mid})`, 'success');
          document.getElementById('movieId').scrollIntoView({ behavior: 'smooth' });
          fetchMovie();
        };
        container.appendChild(div);
      });
    } catch(e) {
      setStatus('searchStatus', `Error: ${e.message}`, 'error');
    }
    loading('searchBtn', false);
  }

  // Try to load API url from localStorage if available
  try {
    const saved = localStorage.getItem('showbox_api_url');
    if (saved) document.getElementById('apiUrl').value = saved;
    document.getElementById('apiUrl').addEventListener('input', e => {
      localStorage.setItem('showbox_api_url', e.target.value);
    });
  } catch(e) {}
</script>
</body>
</html>
