<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2Khemirix Tv</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">
        <i class="fas fa-film"></i>
        <img src="./css/img/khemirix.png" alt="Khemirix" width="50%">
      </span>
      <div class="d-flex gap-3 align-items-center">
        <div class="nav-tabs-custom">
          <button type="button" class="tab-btn" data-tab="movies" tabindex="0">Movies</button>
          <button type="button" class="tab-btn" data-tab="tv" tabindex="0">TV Shows</button>
          <a href="tv.html" class="tab-btn" data-tab="live" tabindex="0">Live TV</a>
        </div>
        <div class="nav-search-wrap">
          <div class="nav-search-row">
            <input type="text" id="searchInput" class="form-control form-control-sm search-input"
              placeholder="Search movies, shows…" aria-label="Search" tabindex="0">
            <button type="button" id="searchClear" class="search-clear" tabindex="0" aria-label="Clear search">×</button>
          </div>
          <div class="search-filters" id="searchFilters" aria-label="Filter search results">
            <button type="button" class="search-filter active" data-filter="all" tabindex="0">All</button>
            <button type="button" class="search-filter" data-filter="movie" tabindex="0">Movies</button>
            <button type="button" class="search-filter" data-filter="tv" tabindex="0">TV Shows</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div id="heroImage">
    <div class="hero-content">
      <h1 id="heroTitle"></h1>
      <p id="heroDescription"></p>
      <button id="heroPlayBtn">Play Now</button>
    </div>
  </div>

  <!-- Content -->
  <div class="container-fluid content-container">
    <div id="mainContent"></div>
  </div>

  <!-- Details Modal -->
  <div id="detailsModal" class="details-modal" role="dialog" aria-modal="true" hidden>
    <button id="detailsClose" class="details-close" aria-label="Close details" tabindex="0">X</button>
    <div class="details-scroll">
      <div id="detailsBackdrop" class="details-backdrop"></div>
      <div class="details-inner">
        <div class="details-header">
          <img id="detailsPoster" class="details-poster" src="" alt="Poster">
          <div class="details-copy">
            <span id="detailsType" class="details-type">MOVIE</span>
            <h1 id="detailsTitle">Loading…</h1>
            <div id="detailsMeta" class="details-meta"></div>
            <div id="detailsGenres" class="details-genres"></div>
            <p id="detailsOverview" class="details-overview"></p>
            <button id="detailsPlayBtn" class="details-play" type="button" tabindex="0">Play now</button>
          </div>
        </div>
        <section id="detailsEpisodesSection" class="details-episodes" hidden>
          <div class="details-episodes-head">
            <h2>Episodes</h2>
            <div id="detailsSeasonTabs" class="details-season-tabs"></div>
          </div>
          <div id="detailsEpisodeList" class="details-episode-list"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- ── Cinematic custom player ────────────────────────────────── -->
  <div id="playerModal" class="pv-modal" role="dialog" aria-modal="true" aria-label="Video Player">
    <div id="playerInner">
      <div id="playerMain">

        <div id="playerStateLoading" class="pv-state">
          <div class="pv-spinner-lg"></div>
          <div id="playerLoadingTitle">Preparing your stream…</div>
        </div>

        <div id="playerStateVideo" class="pv-video-state" hidden>
          <div id="playerStage">
            <video id="playerVideo" playsinline preload="metadata" aria-label="Video"></video>

            <div class="pv-chrome pv-topbar">
              <button id="playerClose" class="pv-icon-btn" type="button" aria-label="Close player" tabindex="0">
                <i class="fas fa-arrow-left"></i>
              </button>
              <div class="pv-heading">
                <span class="pv-kicker">KHEMIRIX TV</span>
                <h2 id="playerTitle"></h2>
              </div>
              <span id="qualityBadge" class="pv-quality-badge" title="">—</span>
            </div>

            <div id="playerCenter" class="pv-center">
              <button id="centerPlayBtn" class="pv-center-play" type="button" aria-label="Play" tabindex="0">
                <i class="fas fa-play"></i>
              </button>
              <div id="playerSpinner" class="pv-center-spinner" hidden aria-label="Buffering"></div>
            </div>

            <div class="pv-chrome pv-bottom">
              <div class="pv-timeline-row">
                <span id="timeCurrent" class="pv-time">0:00</span>
                <div id="timeline" class="pv-timeline" tabindex="0" role="slider"
                     aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                  <div class="pv-timeline-track">
                    <div id="timelineBuffered" class="pv-timeline-buffered"></div>
                    <div id="timelinePlayed" class="pv-timeline-played"></div>
                  </div>
                  <div id="timelineThumb" class="pv-timeline-thumb"></div>
                  <div id="timelinePreview" class="pv-timeline-preview" hidden>0:00</div>
                </div>
                <span id="timeDuration" class="pv-time">0:00</span>
              </div>

              <div class="pv-control-row">
                <div class="pv-control-group">
                  <button id="playPauseBtn" class="pv-icon-btn" type="button" aria-label="Play / pause" tabindex="0">
                    <i class="fas fa-play"></i>
                  </button>
                  <button id="skipBackBtn" class="pv-icon-btn pv-skip-btn" type="button" aria-label="Back 10 seconds" tabindex="0">
                    <i class="fas fa-rotate-left"></i><span>10</span>
                  </button>
                  <button id="skipForwardBtn" class="pv-icon-btn pv-skip-btn" type="button" aria-label="Forward 10 seconds" tabindex="0">
                    <i class="fas fa-rotate-right"></i><span>10</span>
                  </button>
                  <div class="pv-volume">
                    <button id="volumeBtn" class="pv-icon-btn" type="button" aria-label="Mute / unmute" tabindex="0">
                      <i class="fas fa-volume-up"></i>
                    </button>
                    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1"
                           aria-label="Volume" tabindex="0">
                  </div>
                </div>
                <div class="pv-control-group">
                  <button id="subtitleToggle" class="pv-text-btn" type="button" aria-pressed="true"
                          aria-label="Toggle subtitles" tabindex="0" disabled>
                    <i class="fas fa-closed-captioning"></i><span>CC</span>
                  </button>
                  <button id="playerSettingsBtn" class="pv-text-btn" type="button" aria-label="Open settings" tabindex="0">
                    <i class="fas fa-gear"></i><span>Settings</span>
                  </button>
                  <button id="fullscreenBtn" class="pv-icon-btn" type="button" aria-label="Toggle fullscreen" tabindex="0">
                    <i class="fas fa-expand"></i>
                  </button>
                </div>
              </div>
            </div>

            <div id="settingsMenu" class="pv-settings" hidden>
              <div class="pv-settings-head">
                <button id="settingsBack" class="pv-settings-back" type="button" aria-label="Back" tabindex="0" hidden>
                  <i class="fas fa-arrow-left"></i>
                </button>
                <span id="settingsTitle">Settings</span>
                <button id="settingsClose" class="pv-settings-close" type="button" aria-label="Close settings" tabindex="0">
                  <i class="fas fa-xmark"></i>
                </button>
              </div>

              <div id="settingsMain" class="pv-settings-panel" data-panel="main">
                <button class="pv-menu-row" type="button" data-open="quality" tabindex="0">
                  <span>Quality</span><span id="qualitySummary" class="pv-menu-summary">—</span>
                </button>
                <button id="audioMenuRow" class="pv-menu-row" type="button" data-open="audio" tabindex="0" hidden>
                  <span>Audio &amp; Languages</span><span id="audioSummary" class="pv-menu-summary">Not available</span>
                </button>
                <button class="pv-menu-row" type="button" data-open="subtitles" tabindex="0">
                  <span>Subtitles</span><span id="subtitleSummary" class="pv-menu-summary">Loading…</span>
                </button>
                <button class="pv-menu-row" type="button" data-open="speed" tabindex="0">
                  <span>Playback speed</span><span id="speedSummary" class="pv-menu-summary">1×</span>
                </button>
              </div>

              <div id="settingsQuality" class="pv-settings-panel" data-panel="quality" hidden>
                <div class="pv-section-label">Video quality</div>
                <div id="qualityList" class="pv-option-grid"></div>
                <button id="rememberQuality" class="pv-wide-btn" type="button" aria-pressed="false" tabindex="0" disabled>
                  Remember quality: Off
                </button>
              </div>

              <div id="settingsAudio" class="pv-settings-panel" data-panel="audio" hidden>
                <div class="pv-section-label">Audio &amp; Languages</div>
                <div id="audioList" class="pv-option-list"></div>
              </div>

              <div id="settingsSubtitles" class="pv-settings-panel" data-panel="subtitles" hidden>
                <button id="menuSubtitleToggle" class="pv-wide-btn" type="button" aria-pressed="true" tabindex="0" disabled>
                  Subtitles: Loading…
                </button>
                <div class="pv-section-label">Subtitle language</div>
                <div id="subtitleLanguageList" class="pv-option-list"></div>
                <div class="pv-section-label">Subtitle provider</div>
                <div id="subtitleProviderList" class="pv-option-list"></div>
                <div class="pv-section-label">Subtitle size</div>
                <div id="subtitleSizeOptions" class="pv-option-grid">
                  <button class="pv-option" type="button" data-size="small" tabindex="0">Small</button>
                  <button class="pv-option" type="button" data-size="medium" tabindex="0">Medium</button>
                  <button class="pv-option" type="button" data-size="large" tabindex="0">Large</button>
                  <button class="pv-option" type="button" data-size="xlarge" tabindex="0">Extra large</button>
                </div>
                <div class="pv-section-label">Subtitle background</div>
                <div id="subtitleBgOptions" class="pv-option-grid">
                  <button class="pv-option" type="button" data-bg="none" tabindex="0">Transparent</button>
                  <button class="pv-option" type="button" data-bg="dark" tabindex="0">Semi-transparent</button>
                  <button class="pv-option" type="button" data-bg="solid" tabindex="0">Solid</button>
                </div>
              </div>

              <div id="settingsSpeed" class="pv-settings-panel" data-panel="speed" hidden>
                <div class="pv-section-label">Playback speed</div>
                <div id="speedList" class="pv-option-grid"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="playerStateError" class="pv-state" hidden>
          <div class="pv-error-icon"><i class="fas fa-circle-exclamation"></i></div>
          <div class="pv-error-title">Not Found</div>
          <div id="playerErrorMsg"></div>
          <button id="playerErrorClose" class="pv-wide-btn" type="button" tabindex="0">Close player</button>
        </div>
      </div>

      <!-- Episode rail for TV titles -->
      <div id="episodePanel" hidden>
        <div id="seasonTabs"></div>
        <div id="episodeList"></div>
      </div>
    </div>
    <div id="playerToast" class="pv-toast" hidden></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/resolver.js"></script>
  <script src="js/stream-detector.js"></script>
  <script src="js/media-player.js"></script>
  <script src="js/subtitles.js"></script>
  <script src="js/player-controller.js"></script>
  <script src="js/player-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
